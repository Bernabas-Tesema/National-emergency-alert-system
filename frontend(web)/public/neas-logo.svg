<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#061226"/>
      <stop offset="60%" stop-color="#030814"/>
      <stop offset="100%" stop-color="#010308"/>
    </radialGradient>

    <!-- Shield Gradient (Tactical Emerald to Cyber Blue) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Beacon Alert Gradient -->
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGlow)"/>
  <rect width="1016" height="1016" x="4" y="4" rx="220" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Subtle Concentric Radar Rings -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="12 16"/>
  <circle cx="512" cy="512" r="340" fill="none" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="512" cy="512" r="230" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 8"/>

  <!-- Radar Coordinates Crosshairs -->
  <line x1="512" y1="90" x2="512" y2="934" stroke="#10B981" stroke-width="2" stroke-opacity="0.12" stroke-dasharray="8 12"/>
  <line x1="90" y1="512" x2="934" y2="512" stroke="#10B981" stroke-width="2" stroke-opacity="0.12" stroke-dasharray="8 12"/>

