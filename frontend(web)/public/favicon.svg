  <line x1="32" y1="22" x2="32" y2="19" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="40" y2="22" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="24" x2="24" y2="22" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round"/>
