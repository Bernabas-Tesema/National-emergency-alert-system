  <path d="M50 10 Q55 8 58 12" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
  <path d="M51 14 Q56 11 59 16" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round"/>
