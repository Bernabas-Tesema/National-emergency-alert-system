<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>National Emergency Alert System</title>
    <script>
      try {
        var saved = localStorage.getItem('ness-appearance')
        document.documentElement.dataset.appearance = saved === 'bright' ? 'bright' : 'dim'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
